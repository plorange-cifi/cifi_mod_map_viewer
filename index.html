<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Mod Map Planner</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #120d0d;
    --panel: #211414;
    --line: #56342d;
    --text: #f1e9dc;
    --muted: #b7a69a;
    --accent: #f0c95c;
    --field: #100b0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 12px 18px;
    background: rgba(33, 20, 20, 0.97);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 5px 20px #0008;
  }
  h1 {
    margin: 0 10px 0 0;
    color: var(--accent);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .control {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
  }
  .control input[type="text"] {
    width: 105px;
    padding: 7px 8px;
    border: 1px solid #68443a;
    border-radius: 3px;
    background: var(--field);
    color: var(--text);
    font: 13px Consolas, monospace;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    padding: 7px 11px;
    border: 1px solid #8c6446;
    border-radius: 3px;
    background: #38251d;
    color: var(--text);
    cursor: pointer;
  }
  button:hover { background: #503326; }
  #status {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
  }
  main { padding: 12px; }
  .map-scroll {
    width: 100%;
    height: calc(100vh - 94px);
    min-height: 360px;
    overflow: auto;
    border: 1px solid var(--line);
    background: #0a0707;
  }
  #mapCanvas {
    position: relative;
    width: 1161px;
    max-width: none;
    margin: 0 auto;
    line-height: 0;
  }
  #mapImage { display: block; width: 100%; height: auto; cursor: pointer; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .future-box { stroke-width: 2; vector-effect: non-scaling-stroke; }
  .map-label {
    fill: #fff7ce;
    stroke: #160d0b;
    stroke-width: 3px;
    paint-order: stroke;
    font: 700 13px Consolas, monospace;
    text-anchor: middle;
    dominant-baseline: auto;
  }
  .map-label.future { fill: #fff; font-size: 12px; }
  .map-label.over-limit { fill: #ff4d4f; }
  .map-label.mp-limit-indicator { fill: #ff4d4f; font-size: 10px; }
  .mod-badge { cursor: pointer; }
  .mod-badge:hover rect { opacity: 0.85; }
  .locked-icon {
    fill: #ff6b6b;
    font-weight: bold;
    font-size: 10px;
  }
  .tooltip {
    display: none;
    position: fixed;
    background: rgba(33, 20, 20, 0.95);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text);
    max-width: min(320px, calc(100vw - 16px));
    z-index: 1000;
    pointer-events: none;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .tooltip.visible { display: block; }
  .tooltip-title { font-weight: bold; color: var(--accent); }
  .tooltip-line { margin-top: 4px; }
  .tooltip-locked { color: #ff6b6b; }
  @media (max-width: 760px) {
    header { gap: 10px 14px; padding: 10px 12px; flex-wrap: wrap; }
    h1 { width: 100%; font-size: 18px; }
    #status { margin-left: 0; width: 100%; }
    main { padding: 7px; }
    .map-scroll { height: calc(100vh - 165px); }
  }
</style>
</head>
<body>
<header>
  <h1>Loop Mod Map</h1>
  <label class="control">Current MP <input id="currentMp" type="text" value="0" aria-label="Current MP"></label>
  <label class="control">Max future MP <input id="futureMp" type="text" value="0" aria-label="Maximum future MP"></label>
  <label class="control"><input id="limitMaxMp" type="checkbox"> Limit to max MP</label>
  <button id="updateButton" type="button">Update</button>
  <button id="resetButton" type="button">Reset</button>
  <span id="status" role="status">Loading map data...</span>
</header>
<main>
  <div class="map-scroll" id="mapScroll">
    <div id="mapCanvas">
      <img id="mapImage" src="./loop_mod_map.png" alt="Loop modification map">
      <svg id="overlay" aria-label="Expected mod levels"></svg>
    </div>
  </div>
</main>
<div id="tooltip" class="tooltip"></div>
<script>
(() => {
  const palette = {
    MP: '#e63946', Cells: '#39ff14', Shards: '#00d9ff', Research: '#f4a261',
    AP: '#173f8a', Materials: '#6a994e', 'Tickspeed Mult': '#577590',
    LP: '#b028d6', RP: '#f77ff7', Diamonds: '#e6b422',
    'Loop Reset Reduction': '#8d5a97', Unknown: '#777777'
  };
  const suffixExponents = { k: 3, m: 6, b: 9, t: 12, qa: 15, qu: 18, sx: 21, sp: 24, o: 27, n: 30, d: 33 };
  const status = document.getElementById('status');
  const image = document.getElementById('mapImage');
  const overlay = document.getElementById('overlay');
  const currentMpInput = document.getElementById('currentMp');
  const futureMpInput = document.getElementById('futureMp');
  const limitMaxMpCheckbox = document.getElementById('limitMaxMp');
  const tooltip = document.getElementById('tooltip');
  let mods = [];
  let badges = [];
  let userLevels = new Map(); // Code -> userSetLevel
  let autoLevels = new Map(); // Code -> autoCalculatedLevel
  let tooltipTimeout = null;

  // URL state management
  function levelCodebook() {
    return [...new Set(mods.map(mod => mod.Code))].sort();
  }

  function userLevelBlocks() {
    const codes = levelCodebook();
    const modsByCode = new Map(mods.map(mod => [mod.Code, mod]));
    const groups = new Map();
    for (const code of codes) {
      const letter = code[0];
      if (!groups.has(letter)) groups.set(letter, []);
      groups.get(letter).push(code);
    }

    const blocks = [];
    for (const [letter, groupCodes] of groups) {
      const slots = [];
      let hasUserLevel = false;
      for (const code of groupCodes) {
        const level = userLevels.get(code) || 0;
        const maxLevel = modsByCode.get(code).levels.length;
        const width = maxLevel > 35 ? 2 : 1;
        if (!Number.isInteger(level) || level < 0 || level > maxLevel || level >= 36 ** width) return null;
        if (level > 0) hasUserLevel = true;
        slots.push({ level, encoded: level.toString(36).toUpperCase().padStart(width, '0') });
      }
      if (hasUserLevel) {
        while (slots.length && slots[slots.length - 1].level === 0) slots.pop();
        blocks.push(letter + slots.map(slot => slot.encoded).join(''));
      }
    }
    return blocks.join('-');
  }

  function decodeUserLevelBlocks(encoded) {
    if (!encoded) return {};
    const codes = levelCodebook();
    const modsByCode = new Map(mods.map(mod => [mod.Code, mod]));
    const groups = new Map();
    for (const code of codes) {
      const letter = code[0];
      if (!groups.has(letter)) groups.set(letter, []);
      groups.get(letter).push(code);
    }

    const userLevels = {};
    const seen = new Set();
    for (const block of encoded.split('-')) {
      if (!block) return {};
      const letter = block[0];
      const groupCodes = groups.get(letter);
      if (!groupCodes || seen.has(letter)) return {};
      seen.add(letter);
      let offset = 1;

      for (const code of groupCodes) {
        const width = modsByCode.get(code).levels.length > 35 ? 2 : 1;
        if (offset === block.length) break;
        const valueText = block.slice(offset, offset + width);
        if (valueText.length !== width || !/^[0-9A-Z]+$/.test(valueText)) return {};
        const level = Number.parseInt(valueText, 36);
        if (!Number.isInteger(level) || level > modsByCode.get(code).levels.length) return {};
        if (level > 0) userLevels[code] = level;
        offset += width;
      }
      if (offset !== block.length) return {};
    }
    return userLevels;
  }

  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      currentMp: params.get('currentMp') || '0',
      futureMp: params.get('futureMp') || '0',
      limitMaxMp: params.get('limitMaxMp') === '1',
      userLevels: decodeUserLevelBlocks(params.get('u') || '')
    };
  }

  function restoreUrlState() {
    const params = getUrlParams();
    currentMpInput.value = params.currentMp;
    futureMpInput.value = params.futureMp;
    limitMaxMpCheckbox.checked = params.limitMaxMp;
    userLevels = new Map(Object.entries(params.userLevels));
  }

  function setUrlParams() {
    const params = new URLSearchParams();
    if (currentMpInput.value && currentMpInput.value !== '0') params.set('currentMp', currentMpInput.value);
    if (futureMpInput.value && futureMpInput.value !== '0') params.set('futureMp', futureMpInput.value);
    if (limitMaxMpCheckbox.checked) params.set('limitMaxMp', '1');
    if (userLevels.size) params.set('u', userLevelBlocks() || '');
    const newUrl = params.toString() ? `?${params}` : window.location.pathname;
    window.history.replaceState({}, '', newUrl);
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (char === '"') quoted = false;
        else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ',') { row.push(field); field = ''; }
      else if (char === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
      else field += char;
    }
    if (field.length || row.length) { row.push(field.replace(/\r$/, '')); rows.push(row); }
    if (!rows.length) return [];
    const headers = rows.shift().map(value => value.trim());
    return rows.filter(values => values.some(value => value.trim())).map(values =>
      Object.fromEntries(headers.map((header, index) => [header, (values[index] ?? '').trim()]))
    );
  }

  function parseMagnitude(value) {
    const text = String(value ?? '').trim().toLowerCase().replace(/\s+/g, '');
    const suffix = text.match(/^([0-9]*\.?[0-9]+)(k|m|b|t|qa|qu|sx|sp|o|n|d)$/);
    if (suffix) {
      const amount = Number(suffix[1]);
      if (!(amount > 0) || !Number.isFinite(amount)) return null;
      const shift = Math.floor(Math.log10(amount));
      return { mantissa: amount / (10 ** shift), exponent: suffixExponents[suffix[2]] + shift };
    }
    const scientific = text.match(/^([+]?(?:\d+\.?\d*|\.\d+))e([+-]?\d+)$/);
    if (scientific) {
      const mantissa = Number(scientific[1]);
      const shift = Math.floor(Math.log10(mantissa));
      if (!(mantissa > 0) || !Number.isFinite(mantissa)) return null;
      return { mantissa: mantissa / (10 ** shift), exponent: Number(scientific[2]) + shift };
    }
    const number = Number(text);
    if (!(number > 0) || !Number.isFinite(number)) return null;
    const exponent = Math.floor(Math.log10(number));
    return { mantissa: number / (10 ** exponent), exponent };
  }

  function compare(a, b) {
    if (a.exponent !== b.exponent) return a.exponent < b.exponent ? -1 : 1;
    return a.mantissa === b.mantissa ? 0 : (a.mantissa < b.mantissa ? -1 : 1);
  }

  function add(a, b) {
    const exponent = Math.max(a.exponent, b.exponent);
    const mantissa = a.mantissa * (10 ** (a.exponent - exponent)) + b.mantissa * (10 ** (b.exponent - exponent));
    const shift = Math.floor(Math.log10(mantissa));
    return { mantissa: mantissa / (10 ** shift), exponent: exponent + shift };
  }

  function affordableLevelCount(mod, budget, strictlyBelow = false) {
    if (!budget) return 0;
    let spent = { mantissa: 0, exponent: 0 }, count = 0;
    for (const level of mod.levels) {
      if (!level.cost) continue;
      const nextSpent = spent.mantissa === 0 ? level.cost : add(spent, level.cost);
      const comparison = compare(nextSpent, budget);
      if (comparison > 0 || (strictlyBelow && comparison === 0)) break;
      spent = nextSpent;
      count++;
    }
    return count;
  }

  function colorFor(type) { return palette[type] || palette.Unknown; }

  function prerequisiteCodes(mod) {
    return (mod.unlockedBy || '').split(',').map(code => code.trim())
      .filter(code => code && mods.some(candidate => candidate.Code === code));
  }

  function canUnlock(modCode, checking = new Set()) {
    if (checking.has(modCode)) return false;
    const mod = mods.find(m => m.Code === modCode);
    if (!mod) return true;
    const unlockerCodes = prerequisiteCodes(mod);
    if (!unlockerCodes.length) return true;
    const nextChecking = new Set(checking);
    nextChecking.add(modCode);
    return unlockerCodes.every(unlockerCode => {
      const unlockerLevel = getDisplayLevel(unlockerCode);
      return unlockerLevel >= 1 && canUnlock(unlockerCode, nextChecking);
    });
  }

  function calculateAutoLevel(modCode, budget) {
    const mod = mods.find(m => m.Code === modCode);
    if (!mod) return 0;
    return affordableLevelCount(mod, budget);
  }

  function calculateFutureLevel(modCode, budget, cache, calculating = new Set()) {
    if (cache.has(modCode)) return cache.get(modCode);
    if (calculating.has(modCode)) return 0;

    const mod = mods.find(m => m.Code === modCode);
    if (!mod) return 0;

    if (!canUnlock(modCode)) {
      calculating.add(modCode);
      const canMeetPrerequisites = prerequisiteCodes(mod).every(unlockerCode =>
        calculateFutureLevel(unlockerCode, budget, cache, calculating) >= 1
      );
      calculating.delete(modCode);
      if (!canMeetPrerequisites) {
        cache.set(modCode, 0);
        return 0;
      }
    }

    const futureLevel = affordableLevelCount(mod, budget);
    cache.set(modCode, futureLevel);
    return futureLevel;
  }

  function maxLevelForMod(mod) {
    if (!limitMaxMpCheckbox.checked) return mod.levels.length;
    const budget = parseMagnitude(futureMpInput.value);
    return budget ? affordableLevelCount(mod, budget, true) : 0;
  }

  function getDisplayLevel(modCode) {
    const level = userLevels.has(modCode) ? userLevels.get(modCode) : autoLevels.get(modCode) || 0;
    const mod = mods.find(candidate => candidate.Code === modCode);
    if (!mod || !limitMaxMpCheckbox.checked || userLevels.has(modCode)) return level;
    return Math.min(level, maxLevelForMod(mod));
  }

  function updateAutoLevels() {
    const now = parseMagnitude(currentMpInput.value);
    autoLevels.clear();
    for (const mod of mods) {
      autoLevels.set(mod.Code, calculateAutoLevel(mod.Code, now));
    }
  }

  function changeModLevel(modCode, delta) {
    const mod = mods.find(m => m.Code === modCode);
    if (!mod) return;

    const currentLevel = getDisplayLevel(modCode);
    const maxLevel = mod.levels.length;
    if (delta > 0 && limitMaxMpCheckbox.checked && currentLevel >= maxLevelForMod(mod)) return;

    let newLevel = currentLevel + delta;
    newLevel = Math.max(0, Math.min(newLevel, maxLevel));

    if (newLevel === 0) {
      userLevels.delete(modCode);
    } else {
      // Check unlock requirement
      if (!canUnlock(modCode)) return;
      userLevels.set(modCode, newLevel);
    }

    setUrlParams();
    render();
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
  }

  function showTooltip(badge, group) {
    const modByCode = new Map(mods.map(mod => [mod.Code, mod]));
    const mod = modByCode.get(badge.label);
    if (!mod) return;

    const currentLevel = getDisplayLevel(badge.label);
    const maxLevel = mod.levels.length;
    const isLocked = !canUnlock(badge.label);
    const exceedsMaxMp = limitMaxMpCheckbox.checked && currentLevel > maxLevelForMod(mod);

    let html = `<div class="tooltip-title">${mod.mod_name} (${mod.Code})</div>`;
    html += `<div class="tooltip-line">Type: ${mod.mod_type}</div>`;
    if (exceedsMaxMp) html += '<div class="tooltip-line tooltip-locked">Current level exceeds max MP</div>';

    if (isLocked) {
      const unlockerMod = mods.find(m => m.Code === mod.unlockedBy);
      html += `<div class="tooltip-line tooltip-locked">🔒 Locked - requires ${unlockerMod?.mod_name} level 1</div>`;
      if (mod.levels[0]?.cost) {
        html += `<div class="tooltip-line">Cost to unlock: ${formatMagnitude(mod.levels[0].cost)}</div>`;
      }
    } else {
      html += `<div class="tooltip-line">Level: ${currentLevel >= maxLevel ? 'MAX' : currentLevel}/${maxLevel}</div>`;
      if (currentLevel < maxLevel && mod.levels[currentLevel]?.cost) {
        html += `<div class="tooltip-line">Cost to next: ${formatMagnitude(mod.levels[currentLevel].cost)}</div>`;
      }
    }
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');
    const bounds = group.getBoundingClientRect();
    const left = Math.min(bounds.right, window.innerWidth - tooltip.offsetWidth - 8);
    const top = Math.min(bounds.top, window.innerHeight - tooltip.offsetHeight - 8);
    tooltip.style.left = Math.max(8, left) + 'px';
    tooltip.style.top = Math.max(8, top) + 'px';
  }

  function formatMagnitude(mag) {
    if (!mag) return '—';
    const exponent = mag.exponent;
    if (exponent < 3) return String(mag.mantissa * (10 ** exponent));
    const suffixes = ['', 'k', 'm', 'b', 't', 'qa', 'qu', 'sx', 'sp', 'o', 'n', 'd'];
    const suffixIndex = Math.floor(exponent / 3);
    const suffix = suffixes[suffixIndex] || `e${exponent}`;
    const adjustedExp = exponent % 3;
    const value = mag.mantissa * (10 ** adjustedExp);
    return value.toFixed(2).replace(/\.?0+$/, '') + suffix;
  }

  function render() {
    if (!mods.length || !badges.length || !image.naturalWidth) return;
    updateAutoLevels();
    const now = parseMagnitude(currentMpInput.value);
    const later = parseMagnitude(futureMpInput.value);
    const modByCode = new Map(mods.map(mod => [mod.Code, mod]));
    const futureLevels = new Map();
    overlay.setAttribute('viewBox', `0 0 ${image.naturalWidth} ${image.naturalHeight}`);
    overlay.replaceChildren();
    let matched = 0;

    for (const badge of badges) {
      const mod = modByCode.get(badge.label);
      if (mod) matched++;
      const x = Number(badge.x), y = Number(badge.y);
      const width = Number(badge.width), height = Number(badge.height);
      if (![x, y, width, height].every(Number.isFinite)) continue;

      const isLocked = !mod || !canUnlock(badge.label);
      const currentLevel = isLocked ? 0 : getDisplayLevel(badge.label);
      const maxLevel = mod ? mod.levels.length : 0;
      const maxMpLevel = mod && limitMaxMpCheckbox.checked ? maxLevelForMod(mod) : maxLevel;
      const userLevelOverLimit = !isLocked && limitMaxMpCheckbox.checked && userLevels.has(badge.label)
        && userLevels.get(badge.label) > maxMpLevel;
      const limitedByMaxMp = !isLocked && limitMaxMpCheckbox.checked
        && maxMpLevel < maxLevel && currentLevel >= maxMpLevel;

      let futureLevel = 0;
      if (mod && later) {
        futureLevel = calculateFutureLevel(mod.Code, later, futureLevels);
      }

      const extra = Math.max(0, futureLevel - currentLevel);
      const color = mod ? colorFor(mod.mod_type) : palette.Unknown;

      // Create clickable group
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('class', 'mod-badge');
      group.style.cursor = 'pointer';

      // Background rect for click area
      const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bgRect.setAttribute('x', x); bgRect.setAttribute('y', y);
      bgRect.setAttribute('width', width); bgRect.setAttribute('height', height);
      bgRect.setAttribute('rx', 3);
      bgRect.setAttribute('fill', 'transparent');
      bgRect.setAttribute('stroke', 'none');
      group.append(bgRect);

      // Future highlight box
      if (extra > 0 && later) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', width); rect.setAttribute('height', height);
        rect.setAttribute('rx', 3);
        rect.setAttribute('fill', color); rect.setAttribute('fill-opacity', '0.35');
        rect.setAttribute('stroke', color); rect.setAttribute('class', 'future-box');
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        title.textContent = `${mod.mod_name} (${mod.mod_type}): ${currentLevel} now, +${extra} by max future MP`;
        rect.append(title);
        group.append(rect);
      }

      // Main level label
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', x + width / 2);
      label.setAttribute('y', y + height - 2);
      label.setAttribute('class', 'map-label');
      if (userLevelOverLimit) label.classList.add('over-limit');
      if (isLocked) {
        label.textContent = '🔒';
      } else if (!mod || mod.levels.length === 0 || currentLevel === 0) {
        label.textContent = '0';
      } else {
        label.textContent = (currentLevel >= maxLevel ? 'MAX' : String(currentLevel));
      }
      group.append(label);

      // Future level indicator
      if (extra > 0 && later && !limitedByMaxMp) {
        const futureLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        futureLabel.setAttribute('x', x + width / 2);
        futureLabel.setAttribute('y', y + height - 15);
        futureLabel.setAttribute('class', 'map-label future');
        futureLabel.textContent = `+${extra}`;
        group.append(futureLabel);
      }

      if (limitedByMaxMp) {
        const limitLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        limitLabel.setAttribute('x', x + width / 2);
        limitLabel.setAttribute('y', y + height - 15);
        limitLabel.setAttribute('class', 'map-label mp-limit-indicator');
        limitLabel.textContent = '⬆️ MP';
        group.append(limitLabel);
      }

      // Event handlers
      group.addEventListener('click', (e) => {
        e.preventDefault();
        changeModLevel(badge.label, 1);
      });
      group.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        changeModLevel(badge.label, -1);
      });
      group.addEventListener('mouseenter', () => {
        tooltipTimeout = setTimeout(() => showTooltip(badge, group), 1000);
      });
      group.addEventListener('mouseleave', () => {
        clearTimeout(tooltipTimeout);
        hideTooltip();
      });

      overlay.append(group);
    }

    status.textContent = `${matched} mapped mods | current ${currentMpInput.value || '0'} MP | future ${futureMpInput.value || '0'} MP`;
  }

  async function loadDefault(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${url}: ${response.status}`);
    return response.text();
  }

  async function loadInitialData() {
    try {
      const rows = parseCsv(await loadDefault('./mod_tree_data.csv'));
      mods = buildMods(rows);
      badges = buildBadges(rows);
      
      restoreUrlState();
      render();
    } catch (error) {
      status.textContent = 'Unable to load data; open this page through a local web server';
    }
  }

  function buildMods(rows) {
    const byCode = new Map();
    for (const row of rows) {
      if (!row.Code) continue;
      if (!byCode.has(row.Code)) byCode.set(row.Code, {
        Code: row.Code, mod_name: row.mod_name || row.Code,
        mod_type: row.mod_type || 'Unknown', levels: [],
        unlockedBy: row['Unlocked By'] || null
      });
      const cost = parseMagnitude(row.cost);
      byCode.get(row.Code).levels.push({ level: Number(row.mod_level) || 0, cost });
    }
    return [...byCode.values()].map(mod => ({
      ...mod, levels: mod.levels.sort((a, b) => a.level - b.level)
    }));
  }

  function buildBadges(rows) {
    const byLabel = new Map();
    for (const row of rows) {
      if (!row.badge_label || byLabel.has(row.badge_label)) continue;
      byLabel.set(row.badge_label, {
        label: row.badge_label,
        x: row.badge_x,
        y: row.badge_y,
        width: row.badge_width,
        height: row.badge_height
      });
    }
    return [...byLabel.values()];
  }

  function applyCurrentMpToLevels() {
    const now = parseMagnitude(currentMpInput.value);
    if (!now) return;
    
    // Update auto levels first
    updateAutoLevels();
    
    // For any user-set level that's below what current MP can afford, raise it
    for (const [code, userLevel] of userLevels) {
      const autoLevel = autoLevels.get(code) || 0;
      if (autoLevel > userLevel) {
        userLevels.set(code, autoLevel);
      }
    }
    
    setUrlParams();
    render();
  }

  document.getElementById('updateButton').addEventListener('click', () => {
    applyCurrentMpToLevels();
  });
  
  document.getElementById('resetButton').addEventListener('click', () => {
    currentMpInput.value = '0';
    futureMpInput.value = '0';
    limitMaxMpCheckbox.checked = false;
    userLevels.clear();
    setUrlParams();
    render();
  });

  limitMaxMpCheckbox.addEventListener('change', render);

  for (const input of [currentMpInput, futureMpInput]) {
    input.addEventListener('change', () => {
      if (input === currentMpInput) {
        applyCurrentMpToLevels();
      } else {
        setUrlParams();
        render();
      }
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        if (event.target === currentMpInput) {
          applyCurrentMpToLevels();
        } else {
          setUrlParams();
          render();
        }
      }
    });
  }

  image.addEventListener('load', render);
  image.addEventListener('error', () => { status.textContent = 'Unable to load map image'; });
  overlay.addEventListener('mouseleave', hideTooltip);

  loadInitialData();
})();
</script>
</body>
</html>
